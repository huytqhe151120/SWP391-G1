<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - SWP391-G1</title>
</head>
<body>
<main>
    <h1>SWP391-G1</h1>

    <!-- Shown after a failed login (/login?error). -->
    <p th:if="${loginError}" th:text="'Invalid username or password.'">Invalid username or password.</p>

    <!-- Shown after a successful logout (/login?logout). -->
    <p th:if="${logoutSuccess}" th:text="'You have been signed out.'">You have been signed out.</p>

    <form th:action="@{/login}" method="post">
        <!-- Hidden CSRF token emitted by Thymeleaf; required by Spring Security. -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
