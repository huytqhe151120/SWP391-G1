# ============================================================================
#  SWP391-G1 - Application configuration
# ============================================================================
#  Placeholder syntax  ${ENV_VAR:default}  reads an environment variable and
#  falls back to a development-friendly default. Never commit real credentials.
# ============================================================================

spring.application.name=SWP391-G1
server.port=${SERVER_PORT:8080}

spring.thymeleaf.cache=false

# ---------------- Authentication (v1.0 dev placeholder) ----------------
# The business data model is NOT finalized, so v1.0 authentication uses exactly one
# DEVELOPMENT-ONLY in-memory account configured here (see SecurityConfig).
# This is a phase-1 placeholder ONLY:
#   - No user/account entity, no table, no repository exist yet.
#   - Replace this account source with a real UserDetailsService backed by the
#     business account table in a later phase.
# Default credentials: admin / admin123. The password is stored as a BCrypt hash
# (verified to match "admin123") and is never stored as plain text. Override these
# variables in your local environment (never commit real credentials):
#   APP_AUTH_DEV_USERNAME / APP_AUTH_DEV_PASSWORD / APP_AUTH_DEV_ROLES
app.auth.dev-account.username=${APP_AUTH_DEV_USERNAME:admin}
app.auth.dev-account.password=${APP_AUTH_DEV_PASSWORD:$2a$10$m1hNGyXMUCXm9obdxdDbs.m8V.zgoX6xfD3YYYfTZMdPajRx383Sq}
app.auth.dev-account.roles=${APP_AUTH_DEV_ROLES:USER}

# ---------------- Microsoft SQL Server (datasource) ----------------
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:swp391_db};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---------------- JPA / Hibernate ----------------
# Explicit dialect avoids an auto-detection connection at startup.
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# Hibernate never creates, updates or drops the database schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}