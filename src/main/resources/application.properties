# Env placeholders (${ENV_VAR:default}) fall back to development defaults.
# Never commit real credentials.

spring.application.name=SWP391-G1
server.port=${SERVER_PORT:8080}

spring.thymeleaf.cache=false

# ---------------- Authentication ----------------
# Temporary development account until the business account model is finalized.
# Temporary development account: admin / admin123 (BCrypt hash). Override via APP_AUTH_DEV_*.
app.auth.dev-account.username=${APP_AUTH_DEV_USERNAME:admin}
app.auth.dev-account.password=${APP_AUTH_DEV_PASSWORD:$2a$10$m1hNGyXMUCXm9obdxdDbs.m8V.zgoX6xfD3YYYfTZMdPajRx383Sq}
app.auth.dev-account.roles=${APP_AUTH_DEV_ROLES:USER}

# ---------------- Microsoft SQL Server (datasource) ----------------
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:swp391_db};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---------------- JPA / Hibernate ----------------
# Explicit dialect avoids an auto-detection connection at startup.
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# Hibernate never creates, updates or drops the database schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}