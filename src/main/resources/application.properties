# ============================================================================
#  SWP391-G1 - Application configuration
# ============================================================================
#  Placeholder syntax  ${ENV_VAR:default}  reads an environment variable and
#  falls back to a development-friendly default. Never commit real credentials.
# ============================================================================

spring.application.name=SWP391-G1
server.port=${SERVER_PORT:8080}

# ---------------- Microsoft SQL Server (datasource) ----------------
spring.datasource.url=jdbc:sqlserver://${DB_HOST:swp391g1server.database.windows.net}:${DB_PORT:1433};databaseName=${DB_NAME:swp391g1};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:change-me}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---------------- JPA / Hibernate ----------------
# Explicit dialect avoids an auto-detection connection at startup.
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# Hibernate never creates, updates or drops the database schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}