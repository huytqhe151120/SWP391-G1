# ============================================================================
#  SWP391-G1 - TEST profile
# ============================================================================
#  The authentication/error-handling tests activate this profile with
#  @ActiveProfiles("test") so a running SQL Server is not required. It excludes
#  the JPA/DataSource auto-configurations (tests never touch the database);
#  all other settings are inherited from src/main/resources/application.properties.
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
spring.autoconfigure.exclude[1]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.autoconfigure.exclude[2]=org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

spring.jpa.hibernate.ddl-auto=none